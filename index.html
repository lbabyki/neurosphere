<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <title>Interactive 4-Layer Particle Sphere</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: white;
      }

      /* Video Input ẩn (chỉ dùng để xử lý AI) */
      #input_video {
        display: none;
      }

      /* Container cho UI điều khiển */
      #ui-container {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 220px;
        background: rgba(20, 20, 20, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        z-index: 100;
        transition: opacity 0.3s;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 5px 0;
        font-weight: 600;
        background: linear-gradient(90deg, #00c9ff 0%, #92fe9d 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        font-size: 13px;
        color: #ccc;
        margin-bottom: 10px;
        line-height: 1.5;
      }

      .color-control {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .color-control label {
        font-size: 12px;
        font-weight: 500;
        color: #ddd;
      }

      input[type="color"] {
        -webkit-appearance: none;
        border: none;
        width: 20px;
        height: 12.5px;
        border-radius: 2px;
        cursor: pointer;
        background: none;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: 1px solid #555;
        border-radius: 4px;
      }

      #status-bar {
        margin-top: 7.5px;
        padding-top: 7.5px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 12px;
        font-weight: bold;
        display: flex;
        align-items: center;
      }

      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: #ff4757;
        margin-right: 4px;
        box-shadow: 0 0 4px #ff4757;
      }
      .active .dot {
        background-color: #2ed573;
        box-shadow: 0 0 4px #2ed573;
      }
      .active span {
        color: #2ed573;
      }

      #preview-canvas {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 160px;
        height: 120px;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        transform: scaleX(-1);
        z-index: 90;
      }

      #gesture-cursor { position:fixed; left:0; top:0; width:20px; height:20px; border:2px solid #81efff; border-radius:50%; box-shadow:0 0 14px #00d5ff; pointer-events:none; z-index:95; transform:translate(-50%,-50%); display:none; transition:width .1s,height .1s; }
      #gesture-cursor.target { width:27px; height:27px; border-color:#ffee91; }
      #focus-panel { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(5,17,32,.9); border:1px solid #3fd8ff; box-shadow:0 0 20px #008cff44; border-radius:12px; padding:12px 20px; z-index:92; min-width:160px; text-align:center; display:none; font-size:14px; }
      #focus-panel { width:min(430px, calc(100vw - 32px)); max-width:calc(100vw - 32px); box-sizing:border-box; }
      #focus-panel .concept-extra { display:none; text-align:left; margin-top:10px; line-height:1.5; color:#c6dfec; max-height:min(42vh, 360px); overflow:auto; padding-right:4px; }
      #focus-panel.expanded .concept-extra { display:block; }
      #focus-panel .concept-hint { display:block; font-size:11px; color:#86a9bc; margin-top:5px; }
      #focus-panel.expanded .concept-hint { display:none; }
      #focus-panel button { background:transparent; color:#bdeaff; border:1px solid #457c99; border-radius:6px; margin-left:12px; cursor:pointer; }
      #focus-panel .concept-heading { color:#8bdfff; font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:10px 0 3px; }
      #focus-panel .concept-value { margin:0; }
      #focus-panel #concept-category { color:#9ff6bb; font-size:12px; margin-top:8px; }
      #focus-panel #concept-related { color:#b9d5e2; font-size:12px; margin-bottom:2px; }
      @media (max-width: 560px) { #focus-panel { bottom:12px; padding:10px 12px; font-size:13px; } #focus-panel .concept-extra { max-height:36vh; } }
      #sound-options { margin-top:8px; font-size:12px; display:flex; gap:8px; align-items:center; }
      #sound-options input { width:65px; }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
        margin: 0 auto 10px auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

    <script>
      // ==========================================
      // PHẦN 1: KHỞI TẠO THREE.JS (ĐỒ HỌA)
      // ==========================================
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.02);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 8;

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // Group chứa toàn bộ hạt để xoay chung
      const mainGroup = new THREE.Group();
      scene.add(mainGroup);

      // Mảng chứa dữ liệu lớp để đổi màu / animate
      const layers = [];

      // Scale (canvas px -> world units)
      const LABEL_SCALE = 0.0075;
      const ICON_SCALE = 0.015;

      // Độ mịn cong của chữ
      const CURVE_SEGMENT_SIZE = 0.07;

      // Icon files (unique across all layers)
      const ICON_FILES = [
        "img/agents.png",
        "img/ai (1).png",
        "img/ai-robot.png",
        "img/ai.png",
        "img/algorithm.png",
        "img/artificial-intelligence (1).png",
        "img/artificial-intelligence.png",
        "img/automation (1).png",
        "img/automation.png",
        "img/big-data.png",
        "img/brain-process.png",
        "img/business-intelligence.png",
        "img/chat-gpt.png",
        "img/chat.png",
        "img/chipset.png",
        "img/communication-skills.png",
        "img/configuration.png",
        "img/data-ai.png",
        "img/data-automation.png",
        "img/database-storage.png",
        "img/deep-learning (1).png",
        "img/deep-learning.png",
        "img/development.png",
        "img/diagram.png",
        "img/engineering.png",
        "img/Few_Shot_Learning-removebg-preview.png",
        "img/future-technology.png",
        "img/globe.png",
        "img/hallucination.png",
        "img/hierarchy.png",
        "img/image.png",
        "img/integration.png",
        "img/intelligence.png",
        "img/internet-of-things.png",
        "img/k-nearest.png",
        "img/knowledge-transfer.png",
        "img/langchain-logo_brandlogos.net_9zgaw-512x512-removebg-preview.png",
        "img/language-understanding-tools.png",
        "img/lateral-thinking.png",
        "img/layers.png",
        "img/machine-learning (1).png",
        "img/machine-learning.png",
        "img/map.png",
        "img/mindset.png",
        "img/movies.png",
        "img/Multimodal ai.png",
        "img/nlp.png",
        "img/One shot learning.png",
        "img/protection.png",
        "img/quantum-computing.png",
        "img/regression.png",
        "img/reinforcement-learning.png",
        "img/scurm.png",
        "img/setting.png",
        "img/time.png",
        "img/virtual-reality.png",
        "img/voice-assistant.png",
      ];

      const ICON_BASE_SIZE = 36;
      const ICON_WORLD_SIZE = ICON_BASE_SIZE * ICON_SCALE;
      const iconPool = ICON_FILES.slice();
      let iconCursor = 0;

      // ✅ Bạn tự nhập text + số lượng icon cho từng lớp tại đây
      // - Số lượng text = texts.length (thêm/bớt phần tử)
      // - Số lượng icon = iconCount
      const LAYER_CONFIGS = [
        {
          labelScale: 0.0035,
          texts: [
            "Generative AI",
            "RLHF",
            "Hallucination",
            "QLoRA",
            "Few Shot Learning",
            "One Shot Learning",
            "Transfer Learning",
            "Large Language Model",
            "Multimodal AI",
            "Langchain",
            "GANs",
            "Agents",
            "BigGAN",
          ],
          iconCount: 3,
          iconScale: 0.7,
        },
        {
          labelScale: 0.0068,
          texts: [
            "Deep Learning",
            "Recurrent Neural Network (RNN)",
            "Convolution Neural Network (CNN)",
            "LSTM",
            "Deep Reinforcement Learning",
            "Transformers",
            "Auto Encoders",
            "GPT",
            "BERT",
            "Epochs",
          ],
          iconCount: 7,
        },
        {
          labelScale: 0.0089,
          texts: [
            "Neural Networks",
            "Perceptron",
            "Feed Forward",
            "Backpropagation",
            "Deep Feed Forward",
            "Multi layer perceptron",
            "Hopfield Network",
            "Feed Forward",
            "Self organising maps",
            "Liquid State Machine",
            "Deep Belieieve Network",
            "Boltzmann Machine",
          ],
          iconCount: 11,
        },
        {
          labelScale: 0.016,
          texts: [
            "Machine Learning",
            "K Means",
            "Unsupervised Machine Learning",
            "Supervised Machine Learning",
            "K-Nearest Neighbors",
            "Decision Trees",
            "Linear Regression",
            "Dimensionality Reduction",
            "Logistic Regression",
            "Support Vector Machines",
            "PCA",
            "Hypothesis Testing",
          ],
          iconCount: 15,
        },
        {
          labelScale: 0.022,
          texts: [
            "Reinforcement Learning",
            "Artificial Intelligence",
            "Speech Recognition",
            "AI Ethics",
            "Emergent behavior",
            "Intelligent Robotics",
            "Augmented Programming",
            "Algorithm Building",
          ],
          iconCount: 21,
        },
      ];

      // =========================
      // HELPERS
      // =========================
      function randomPointOnSphere(radius, thickness) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);
        const r = radius + (Math.random() - 0.5) * thickness;

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        return new THREE.Vector3(x, y, z);
      }

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      shuffleArray(iconPool);

      function getNextIconFile() {
        if (iconCursor >= iconPool.length) {
          return null;
        }
        return iconPool[iconCursor++];
      }

      function createEvenPointsOnSphere(count, radius) {
        const points = [];
        if (count <= 0) {
          return points;
        }

        const offset = 2 / count;
        const increment = Math.PI * (3 - Math.sqrt(5));
        const phase = Math.random() * count;

        const axis = new THREE.Vector3(
          Math.random() * 2 - 1,
          Math.random() * 2 - 1,
          Math.random() * 2 - 1
        );
        if (axis.lengthSq() < 0.0001) {
          axis.set(0, 1, 0);
        } else {
          axis.normalize();
        }
        const rotation = new THREE.Quaternion().setFromAxisAngle(
          axis,
          Math.random() * Math.PI * 2
        );

        for (let i = 0; i < count; i++) {
          const y = i * offset - 1 + offset / 2;
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const phi = (i + phase) * increment;
          const x = Math.cos(phi) * r;
          const z = Math.sin(phi) * r;
          const point = new THREE.Vector3(x, y, z)
            .multiplyScalar(radius)
            .applyQuaternion(rotation);
          points.push(point);
        }

        return points;
      }

      function drawTextCanvas(text, colorHex) {
        const fontSize = 24;
        const padding = 8;
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        ctx.font = `600 ${fontSize}px "Segoe UI", Arial, sans-serif`;
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width);

        canvas.width = textWidth + padding * 2;
        canvas.height = fontSize + padding * 2;

        ctx.font = `600 ${fontSize}px "Segoe UI", Arial, sans-serif`;
        ctx.textBaseline = "top";

        // nền đen nhạt (có thể chỉnh nhỏ hơn bằng bgPad nếu muốn)
        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = colorHex;
        ctx.fillText(text, padding, padding);

        return canvas;
      }

      function createCurvedTextGeometry(width, height, curveRadius) {
        const radius = Math.max(0.1, curveRadius);
        const segmentsX = Math.max(4, Math.round(width / CURVE_SEGMENT_SIZE));
        const geometry = new THREE.PlaneGeometry(width, height, segmentsX, 1);
        const positions = geometry.attributes.position;

        for (let i = 0; i < positions.count; i++) {
          const x = positions.getX(i);
          const angle = x / radius;
          const newX = Math.sin(angle) * radius;
          const newZ = -radius * (1 - Math.cos(angle));

          positions.setX(i, newX);
          positions.setZ(i, newZ);
        }

        positions.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function setMeshTexture(mesh, canvas) {
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.needsUpdate = true;

        if (mesh.material.map) {
          mesh.material.map.dispose();
        }
        mesh.material.map = texture;
        mesh.material.needsUpdate = true;
      }

      function createTextMesh(text, colorHex, curveRadius, labelScale) {
        const canvas = drawTextCanvas(text, colorHex);
        const scale =
          typeof labelScale === "number" && Number.isFinite(labelScale)
            ? labelScale
            : LABEL_SCALE;
        const width = canvas.width * scale;
        const height = canvas.height * scale;

        const geometry = createCurvedTextGeometry(width, height, curveRadius);

        const tex = new THREE.CanvasTexture(canvas);
        tex.minFilter = THREE.LinearFilter;
        tex.needsUpdate = true;

        const material = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.userData = { text: text };
        return mesh;
      }

      function createIconSprite(iconFile, scaleFactor) {
        const finalScale =
          typeof scaleFactor === "number" && Number.isFinite(scaleFactor)
            ? scaleFactor
            : 1;
        const worldSize = ICON_WORLD_SIZE * finalScale;
        const material = new THREE.SpriteMaterial({
          transparent: true,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(material);
        sprite.userData = { iconFile: iconFile };

        const loader = new THREE.TextureLoader();
        const texture = loader.load(encodeURI(iconFile), (loaded) => {
          const image = loaded.image;
          const aspect =
            image && image.width && image.height
              ? image.width / image.height
              : 1;
          sprite.scale.set(worldSize * aspect, worldSize, 1);
          sprite.userData.baseScale = sprite.scale.clone();
        });
        texture.minFilter = THREE.LinearFilter;
        texture.needsUpdate = true;
        material.map = texture;
        material.needsUpdate = true;

        sprite.scale.set(worldSize, worldSize, 1);
        return sprite;
      }

      // ✅ Decor: dùng texts tự nhập + iconCount, và luôn nằm ngoài mặt cầu +0.2
      function addLayerDecorations(layerData, radius, colorHex, config) {
        const texts = config && Array.isArray(config.texts) ? config.texts : [];
        const iconCount =
          config && Number.isFinite(config.iconCount)
            ? Math.max(0, Math.floor(config.iconCount))
            : 0;
        const labelScale =
          config && Number.isFinite(config.labelScale)
            ? config.labelScale
            : LABEL_SCALE;
        const iconScale =
          config && Number.isFinite(config.iconScale) ? config.iconScale : 1;

        const textItems = texts.filter((text) => text);
        const availableIcons = Math.max(0, iconPool.length - iconCursor);
        const iconTarget = Math.min(iconCount, availableIcons);
        const iconFiles = [];

        for (let i = 0; i < iconTarget; i++) {
          const iconFile = getNextIconFile();
          if (!iconFile) {
            break;
          }
          iconFiles.push(iconFile);
        }

        const items = [];
        textItems.forEach((text) => items.push({ type: "text", value: text }));
        iconFiles.forEach((iconFile) =>
          items.push({ type: "icon", value: iconFile })
        );

        if (!items.length) {
          return;
        }

        shuffleArray(items);
        const points = createEvenPointsOnSphere(items.length, radius);

        items.forEach((item, index) => {
          const p = points[index].clone();
          const normal = p.clone().normalize();
          p.addScaledVector(normal, 0.2);

          if (item.type === "text") {
            const label = createTextMesh(
              item.value,
              colorHex,
              radius,
              labelScale
            );
            label.position.copy(p);
            label.up.set(0, 1, 0);
            label.lookAt(label.position.clone().multiplyScalar(2));
            layerData.group.add(label);
            layerData.labels.push(label);
          } else {
            const icon = createIconSprite(item.value, iconScale);
            icon.position.copy(p);
            layerData.group.add(icon);
            icon.userData.basePosition = p.clone();
            icon.userData.baseScale = icon.scale.clone();
            icon.userData.displayName = decodeURIComponent(item.value.split('/').pop().replace(/\.png$/i, '').replace(/[-_]/g, ' '));
            layerData.icons.push(icon);
          }
        });
      }

      function updateLayerColor(layerIndex, colorHex) {
        const layer = layers[layerIndex];
        if (!layer) return;

        layer.points.material.color.set(colorHex);

        // labels (mesh)
        layer.labels.forEach((mesh) => {
          const canvas = drawTextCanvas(mesh.userData.text, colorHex);
          setMeshTexture(mesh, canvas);
        });
      }

      /**
       * Tạo một lớp vỏ cầu hạt
       */
      function createParticleLayer(radius, count, colorHex, size, config) {
        const geometry = new THREE.BufferGeometry();
        const positions = [];

        for (let i = 0; i < count; i++) {
          const pos = randomPointOnSphere(radius, 0.5);
          positions.push(pos.x, pos.y, pos.z);
        }

        geometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(positions, 3)
        );

        const material = new THREE.PointsMaterial({
          color: new THREE.Color(colorHex),
          size: size,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        const particles = new THREE.Points(geometry, material);

        const layerGroup = new THREE.Group();
        layerGroup.add(particles);
        mainGroup.add(layerGroup);

        const layerData = {
          group: layerGroup,
          points: particles,
          labels: [],
          icons: [],
        };

        layers.push(layerData);
        addLayerDecorations(layerData, radius, colorHex, config);
      }

      const WORLD_UP = new THREE.Vector3(0, 1, 0);
      const cameraRotation = new THREE.Quaternion();
      const cameraOffset = new THREE.Vector3();
      const cameraRight = new THREE.Vector3();
      const cameraForward = new THREE.Vector3();
      const cameraTempQuat = new THREE.Quaternion();

      // Biến cho kéo thả bằng tay có quán tính
      const handDragDelta = new THREE.Vector2(0, 0);

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function updateCameraOrbit() {
        cameraOffset.set(0, 0, cameraDistance).applyQuaternion(cameraRotation);
        camera.position.copy(cameraTarget).add(cameraOffset);
        camera.quaternion.copy(cameraRotation);
      }

      function applyCameraRotation(yawDelta, pitchDelta, rollDelta) {
        if (yawDelta) {
          cameraTempQuat.setFromAxisAngle(WORLD_UP, yawDelta);
          cameraRotation.premultiply(cameraTempQuat);
        }
        if (pitchDelta) {
          cameraRight.set(1, 0, 0).applyQuaternion(cameraRotation).normalize();
          cameraTempQuat.setFromAxisAngle(cameraRight, pitchDelta);
          cameraRotation.premultiply(cameraTempQuat);
        }
        if (rollDelta) {
          cameraForward
            .set(0, 0, -1)
            .applyQuaternion(cameraRotation)
            .normalize();
          cameraTempQuat.setFromAxisAngle(cameraForward, rollDelta);
          cameraRotation.premultiply(cameraTempQuat);
        }
        cameraRotation.normalize();
      }

      function applyDragDelta(dx, dy) {
        applyCameraRotation(
          -dx * MOUSE_ROTATE_SENSITIVITY,
          -dy * MOUSE_ROTATE_SENSITIVITY,
          0
        );
      }

      function applyZoomDelta(deltaY) {
        const zoomFactor = Math.exp(deltaY * MOUSE_ZOOM_SPEED);
        cameraDistanceTarget = clamp(
          cameraDistanceTarget * zoomFactor,
          CAMERA_DISTANCE_MIN,
          CAMERA_DISTANCE_MAX
        );
      }

        if (!isMouseDragging) return;
        isMouseDragging = false;
        renderCanvas.style.cursor = "grab";

      renderCanvas.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        isMouseDragging = true;
        lastMouseX = event.clientX;
        lastMouseY = event.clientY;

      });

        const dy = event.clientY - lastMouseY;
        lastMouseX = event.clientX;
        lastMouseY = event.clientY;
        applyDragDelta(dx, dy);

          data.lastEffectTime = now;
          const progress = THREE.MathUtils.clamp(elapsed / 220, 0, 1);
          const easedProgress = 1 - Math.pow(1 - progress, 3);
          icon.position.lerp(destination, easedProgress);
          icon.scale.lerp(data.baseScale.clone().multiplyScalar(scale), easedProgress);
          if (icon.position.distanceToSquared(destination) < 1e-10) icon.position.copy(destination);
          const targetScale = data.baseScale.clone().multiplyScalar(scale);
          if (icon.scale.distanceToSquared(targetScale) < 1e-10) icon.scale.copy(targetScale);
          icon.material.opacity += ((selected || hovered ? 1 : .92) - icon.material.opacity) * .2;
        }
      }
      function updateFingerCursor(landmark) {
        // MediaPipe image uses unmirrored coordinates; preview is mirrored to the viewer.
        // Mirror X so moving the hand right moves the virtual cursor right.
        const x = (1 - landmark.x) * window.innerWidth;
        const y = landmark.y * window.innerHeight;
        if (!smoothedFinger) smoothedFinger = {x,y};
        smoothedFinger.x += (x - smoothedFinger.x) * .34;
        smoothedFinger.y += (y - smoothedFinger.y) * .34;
        cursorEl.style.left = smoothedFinger.x + 'px';
        cursorEl.style.top = smoothedFinger.y + 'px';
        cursorEl.style.display = 'block';
        return findIconAt(smoothedFinger.x,smoothedFinger.y);
      }
      function hideFingerCursor() { cursorEl.style.display='none'; smoothedFinger=null; wasPinching=false; }

      function animate() {
        requestAnimationFrame(animate);

        // Xử lý quán tính khi kéo bằng tay
        // Nếu không trong cử chỉ kéo, áp dụng quán tính (giảm dần)
        if (gestureMode !== "drag") {
          handDragDelta.multiplyScalar(DRAG_INERTIA);
        }

        // Nếu có delta đủ lớn (từ tay hoặc quán tính), thì áp dụng
        if (handDragDelta.lengthSq() > DRAG_DELTA_MIN * DRAG_DELTA_MIN) {
          applyDragDelta(handDragDelta.x, handDragDelta.y);
        } else {
          handDragDelta.set(0, 0); // Reset về 0 nếu quá nhỏ
        }

        // Điều kiện tự xoay:
        // - Không kéo bằng chuột
        // - Không trong cử chỉ kéo tay
        // - Khối cầu không đang xoay vì quán tính
        const isCoasting = handDragDelta.lengthSq() > 0;
        if (!isMouseDragging && gestureMode !== "drag" && !isCoasting && !selectedIcon && !hoveredIcon) {
          // xoay khối chính
          mainGroup.rotation.y += 0.004;
          mainGroup.rotation.z += 0.002;

          // xoay lệch mỗi lớp
          if (layers[0]) layers[0].group.rotation.y += 0.004;
          if (layers[1]) layers[1].group.rotation.y -= 0.004;
          if (layers[2]) layers[2].group.rotation.y += 0.002;
          if (layers[3]) layers[3].group.rotation.y -= 0.002;
          if (layers[4]) layers[4].group.rotation.y += 0.0015;
        }

        // lerp scale
        currentExpansion += (targetExpansion - currentExpansion) * 0.1;
        mainGroup.scale.set(
          currentExpansion,
          currentExpansion,
          currentExpansion
        );

        cameraDistance = lerp(
          cameraDistance,
          cameraDistanceTarget,
          CAMERA_ZOOM_LERP
        );
        updateCameraOrbit();

        updateIconEffects();
        renderer.render(scene, camera);
      }
      animate();

      // ==========================================
      // PHẦN 3: MEDIAPIPE HANDS (CỬ CHỈ)
      // ==========================================
      const videoElement = document.getElementById("input_video");
      const previewCanvas = document.getElementById("preview-canvas");
      const previewCtx = previewCanvas.getContext("2d");
      const statusBar = document.getElementById("status-bar");
      const statusText = document.getElementById("status-text");
      const loadingDiv = document.getElementById("loading");

      function distance2D(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function distance3D(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dz = a.z - b.z;
        return Math.hypot(dx, dy, dz);
      }

      function getPalmCenter(landmarks) {
        return {
          x: landmarks[9].x,
          y: landmarks[9].y,
          z: landmarks[9].z,
        };
      }

      function isFingerExtended(landmarks, tipIdx, pipIdx, mcpIdx, ratio) {
        const tipDist = distance3D(landmarks[tipIdx], landmarks[mcpIdx]);
        const pipDist = distance3D(landmarks[pipIdx], landmarks[mcpIdx]);
        const limit = typeof ratio === "number" ? ratio : 1.12;
        return tipDist > pipDist * limit;
      }

      function countExtendedFingers(landmarks) {
        let count = 0;
        if (isFingerExtended(landmarks, 4, 3, 2, 1.05)) count += 1;
        if (isFingerExtended(landmarks, 8, 6, 5, 1.12)) count += 1;
        if (isFingerExtended(landmarks, 12, 10, 9, 1.12)) count += 1;
        if (isFingerExtended(landmarks, 16, 14, 13, 1.12)) count += 1;
        if (isFingerExtended(landmarks, 20, 18, 17, 1.12)) count += 1;
        return count;
      }

      function isFist(landmarks) {
        return countExtendedFingers(landmarks) <= 1;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function handleHandDrag(cursorX, cursorY) {
        if (!prevDragPos) {
          prevDragPos = { x: cursorX, y: cursorY };
          // Frame đầu tiên của drag mới, reset delta để không bị giật
          handDragDelta.set(0, 0);
          return;
        }
        const dx = cursorX - prevDragPos.x;
        const dy = cursorY - prevDragPos.y;
        prevDragPos = { x: cursorX, y: cursorY };

        // Cập nhật delta để vòng lặp animate() sử dụng
        handDragDelta.set(dx, dy);
      }

      function handleHandZoom(centerA, centerB) {
        const dist =
          distance2D(centerA, centerB) *
          Math.min(window.innerWidth, window.innerHeight);
        if (prevHandZoomDist === null) {
          prevHandZoomDist = dist;
          return;
        }
        const deltaY = prevHandZoomDist - dist;
        prevHandZoomDist = dist;
        if (deltaY === 0) {
          return;
        }
        applyZoomDelta(deltaY);
      }

      function findRightHand(handStates) {
        if (!handStates || handStates.length === 0) {
          return null;
        }

        // 1. Ưu tiên tay được xác định rõ là "Right"
        const labeledRightHand = handStates.find((hand) => hand.label === "Right");
        if (labeledRightHand) {
          return labeledRightHand;
        }

        // 2. Nếu có 2 tay và 1 tay là "Left", thì tay còn lại là tay phải
        if (handStates.length === 2) {
          const leftHand = handStates.find((hand) => hand.label === "Left");
          if (leftHand) {
            return handStates.find((hand) => hand !== leftHand);
          }
        }

        // 3. Nếu chỉ có 1 tay, giả định đó là tay tương tác (tay phải)
        if (handStates.length === 1) {
          return handStates[0];
        }

        // 4. Nếu có 2 tay nhưng không xác định rõ (ví dụ cả 2 là 'Unknown'),
        //    dùng vị trí để đoán: tay bên phải của người dùng (bên trái của camera)
        //    sẽ có tọa độ x nhỏ hơn.
        if (handStates.length === 2) {
          // Tay có tọa độ x nhỏ hơn được cho là tay phải của người dùng
          return handStates[0].center.x < handStates[1].center.x
            ? handStates[0]
            : handStates[1];
        }
        
        // Trường hợp khác, dùng tay đầu tiên tìm thấy
        return handStates[0] || null;
      }

      function onResults(results) {
        loadingDiv.style.display = "none";

        // vẽ preview
        previewCanvas.width = videoElement.videoWidth || previewCanvas.width;
        previewCanvas.height = videoElement.videoHeight || previewCanvas.height;
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(
          results.image,
          0,
          0,
          previewCanvas.width,
          previewCanvas.height
        );

        const hands = results.multiHandLandmarks || [];
        const handCount = hands.length;

        if (handCount > 0) {
          if (!statusBar.classList.contains("active")) {
            statusBar.classList.add("active");
          }
          for (const landmarks of hands) {
            drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, {
              color: "#00FF00",
              lineWidth: 2,
            });
          }
        } else {
          statusBar.classList.remove("active");
          statusText.innerText = "Đang đợi tay...";
          gestureMode = "idle";
          prevDragPos = null;
          prevHandZoomDist = null;
          hideFingerCursor(); setHover(null);
          previewCtx.restore();
          return;
        }

        const handednessList = results.multiHandedness || [];
        const handStates = hands.map((landmarks, index) => {
          const handedness = handednessList[index];
          const label = handedness ? handedness.label : "Unknown";
          return {
            label,
            center: getPalmCenter(landmarks),
            isFist: isFist(landmarks),
            landmarks,
            pointing: isFingerExtended(landmarks,8,6,5,1.08),
            pinchRatio: distance3D(landmarks[4],landmarks[8]) / Math.max(.001,distance3D(landmarks[5],landmarks[17])),
          };
        });

        const rightHand = findRightHand(handStates);
        const otherHand = rightHand
          ? handStates.find((hand) => hand !== rightHand)
          : null;
        const rightCursor = rightHand
          ? {
              x: rightHand.center.x * window.innerWidth,
              y: rightHand.center.y * window.innerHeight,
            }
          : null;
        let nextMode = "idle";

        // Hysteresis: initiate pinch at < .34 palm widths, release at > .52.
        const pinch = !!(rightHand && (wasPinching ? rightHand.pinchRatio < .52 : rightHand.pinchRatio < .34));
        if (rightHand && otherHand) {
          nextMode = "zoom";
        } else if (rightHand && pinch && hoveredIcon) {
          nextMode = 'select';
        } else if (rightHand && rightHand.isFist && !pinch) {
          nextMode = "drag";
        }

        if (nextMode !== gestureMode) {
          if (nextMode !== "drag") {
            prevDragPos = null;
          }
          if (nextMode !== "zoom") {
            prevHandZoomDist = null;
          }
          gestureMode = nextMode;
        }

        if (rightHand && !otherHand && (rightHand.pointing || pinch) && !rightHand.isFist) {
          const icon = updateFingerCursor(rightHand.landmarks[8]);
          setHover(icon);
          if (pinch && !wasPinching && icon) selectIcon(icon);
        } else { hideFingerCursor(); setHover(null); }
        wasPinching = pinch;
        // Independent OPEN PALM dismissal. Never intercept POINT/PINCH/FIST or cursor.
        if (rightHand && !otherHand && !pinch && detectOpenPalm(rightHand.landmarks)) {
          if (openPalmStart === null) openPalmStart = performance.now();
          if (!palmTriggered && performance.now() - openPalmStart >= 520) {
            palmTriggered = true;
            if (selectedIcon) {
              // Use existing selection API; allow immediate dismissal after a selection.
              lastSelection = 0;
              selectIcon(null);
            }
          }
        } else {
          openPalmStart = null;
          palmTriggered = false;
        }
        if (gestureMode === "drag") {
          handleHandDrag(rightCursor.x, rightCursor.y);
          statusText.innerText = "Kéo: tay phải nắm";
        } else if (gestureMode === 'select') {
          statusText.innerText = 'Chụm tay: chọn icon';
        } else if (gestureMode === "zoom") {
          handleHandZoom(rightHand.center, otherHand.center);
          statusText.innerText = "Zoom: 2 tay";
        } else if (rightHand) {
          statusText.innerText = rightHand.pointing ? 'Trỏ vào icon, chụm để chọn' : 'Nắm tay để xoay';
        } else if (handCount >= 1) {
          statusText.innerText = "Chờ tay phải...";
        } else {
          statusText.innerText = "Chờ tay...";
        }

        previewCtx.restore();
      }

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      hands.onResults(onResults);

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480,
      });
      cameraUtils.start().catch(error => {
        console.warn('Camera unavailable; mouse controls remain active', error);
        loadingDiv.style.display = 'none';
        statusText.innerText = 'Không có camera – dùng chuột';
      });
    </script>
  </body>
</html>
